spring.application.name=nexusmarket
server.port=${SERVER_PORT:8080}

# ---------------------------------------------------------------------------
# MySQL (relational persistence: persons, users, products, warehouses,
# inventory, carts, orders, returns). Default: host-local run; under Docker
# Compose use DB_URL=jdbc:mysql://mysql-db:3306/nexusmarket?...
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nexusmarket?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# MongoDB (operational history: inventory movements, shipment tracking).
# Spring Boot 4 uses the spring.mongodb prefix (not spring.data.mongodb).
# ---------------------------------------------------------------------------
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/nexusmarket}

# ---------------------------------------------------------------------------
# Security: JWT signing secret (HS256, at least 32 bytes) and token lifetime.
# The default secret is for local development only; set JWT_SECRET outside it.
# ---------------------------------------------------------------------------
jwt.secret=${JWT_SECRET:4707a9a7d9f48cda523b822012ae177714fdebc84eccbcdb37455936dfde9d8f}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# CORS: the only browser origin allowed to call the API
nexusmarket.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}

# ---------------------------------------------------------------------------
# Observability: only the health endpoint is exposed
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health

# ---------------------------------------------------------------------------
# Billing: VAT rate contained in the catalog prices (0.19 = 19%)
# ---------------------------------------------------------------------------
nexusmarket.billing.tax-rate=${TAX_RATE:0.19}

# ---------------------------------------------------------------------------
# Demo profile: password of the seeded demo accounts (development only;
# override with the DEMO_PASSWORD environment variable)
# ---------------------------------------------------------------------------
nexusmarket.demo.password=${DEMO_PASSWORD:NexusDemo2026}
