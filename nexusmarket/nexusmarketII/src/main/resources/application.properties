spring.application.name=nexusmarket

# ---------------------------------------------------------------------------
# MySQL (relational persistence: persons, products, warehouses, inventory,
# carts, orders, returns)
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/nexusmarket?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# MongoDB (operational history: inventory movements, shipment tracking)
# ---------------------------------------------------------------------------
spring.data.mongodb.uri=mongodb://localhost:27017/nexusmarket

